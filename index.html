            <div class="btn-group btn-group-sm" role="group" aria-label="Til / Language">
                <input type="radio" class="btn-check" name="ui-lang" id="lang-uz" value="uz" autocomplete="off">

            <div class="dropdown">
                <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1"

<main class="container py-4 py-lg-5 flex-grow-1">
    <header class="text-center mb-4 mb-lg-5">
        <h1 class="display-5 fw-bold mb-2">Lotin <span class="text-primary">↔</span> Кирилл</h1>
        <p class="lead text-body-secondary mb-3" data-i18n="lead"></p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <span class="badge rounded-pill bg-success-subtle text-success-emphasis border border-success-subtle feature">
                <svg class="bi"><use href="#i-shield-check"></use></svg> <span data-i18n="badgePrivate"></span></span>
            <span class="badge rounded-pill bg-primary-subtle text-primary-emphasis border border-primary-subtle feature">
                <svg class="bi"><use href="#i-lightning-charge"></use></svg> <span data-i18n="badgeLive"></span></span>
            <span class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle feature">
                <svg class="bi"><use href="#i-code-slash"></use></svg> <span data-i18n="badgeOpen"></span></span>
        </div>
    </header>

    <section class="card shadow-sm converter">
        <div class="card-header bg-body d-flex flex-wrap align-items-center gap-2 py-3">
            <div class="btn-group" role="group" data-i18n-aria="direction">
                <input type="radio" class="btn-check" name="mode" id="mode-lat2cyr" value="lat2cyr" autocomplete="off">
                <label class="btn btn-outline-primary" for="mode-lat2cyr" data-i18n="modeLat2Cyr"></label>
                <input type="radio" class="btn-check" name="mode" id="mode-cyr2lat" value="cyr2lat" autocomplete="off">
                <label class="btn btn-outline-primary" for="mode-cyr2lat" data-i18n="modeCyr2Lat"></label>
            </div>
            <div class="d-flex gap-2 ms-auto">
                <button type="button" id="sample" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
                    <svg class="bi"><use href="#i-stars"></use></svg><span data-i18n="sample"></span></button>
                <button type="button" id="upload" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
                        data-bs-toggle="tooltip" data-i18n-title="uploadHint">
                    <svg class="bi"><use href="#i-upload"></use></svg><span class="d-none d-md-inline" data-i18n="upload"></span></button>
                <input type="file" id="file" accept=".txt,text/plain" hidden>
            </div>
        </div>

        <div class="row g-0 position-relative">
            <div class="col-lg pane" id="source-pane">
                <div class="d-flex align-items-center px-3 pt-3 pb-1">
                    <label for="source" id="source-label" class="fw-semibold pane-label"></label>
                    <button type="button" id="clear" class="btn btn-sm btn-link link-secondary ms-auto p-1"
                            data-bs-toggle="tooltip" data-i18n-title="clear">
                        <svg class="bi"><use href="#i-trash3"></use></svg></button>
                </div>
                <textarea id="source" class="form-control border-0 shadow-none rounded-0 px-3" rows="10"
                          spellcheck="false" autofocus></textarea>
                <div class="px-3 pb-3 pt-1 small text-body-secondary" id="source-count"></div>
            </div>

            <div class="swap-wrap position-absolute top-50 start-50 translate-middle">
                <button type="button" id="swap" class="btn btn-primary rounded-circle shadow swap"
                        data-bs-toggle="tooltip" data-i18n-title="swap">
                    <svg class="bi"><use href="#i-arrow-left-right"></use></svg></button>
            </div>

            <div class="col-lg pane pane-target bg-body-tertiary">
                <div class="d-flex align-items-center gap-1 px-3 pt-3 pb-1">
                    <label for="target" id="target-label" class="fw-semibold pane-label"></label>
                    <button type="button" id="download" class="btn btn-sm btn-link link-secondary ms-auto p-1"
                            data-bs-toggle="tooltip" data-i18n-title="download">
                        <svg class="bi"><use href="#i-download"></use></svg></button>
                    <button type="button" id="copy" class="btn btn-sm btn-primary d-flex align-items-center gap-1">
                        <svg class="bi"><use id="copy-icon" href="#i-clipboard"></use></svg><span data-i18n="copy"></span></button>
                </div>
